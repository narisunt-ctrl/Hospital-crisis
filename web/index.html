<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b4a"><meta name="description" content="เข้าเวรกับ AI — เกม Godot ส่งเวชภัณฑุในโรงพยาบาล รับของ เข็นรถ ช่วยผู้ป่วยให้ทันเวลาในเวร 3 นาที"><title>โรงพยาบาลวิกฤต · เข้าเวรกับ AI</title><link rel="icon" href="/play/index.icon.png"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#102e40;color:#fff8e9;font-family:system-ui,sans-serif}iframe{display:block;width:100%;height:100%;border:0}#rotate{position:fixed;inset:0;background:#123646f5;display:none;place-content:center;text-align:center;padding:28px;z-index:3}#rotate strong{font-size:25px}#rotate p{color:#b8d7d3;font-size:15px;line-height:1.8}button{border:1px solid #fff4;border-radius:12px;padding:12px 20px;background:#159c9d;color:white;font:inherit;cursor:pointer}#fullscreen{position:fixed;bottom:9px;right:9px;background:#163d4ae8;padding:7px 10px;font-size:11px;opacity:.65;z-index:2}#fullscreen:hover{opacity:1}#fullscreen:focus-visible{outline:3px solid #ffce76}@media(orientation:portrait) and (max-width:700px){#rotate:not([hidden]){display:grid}#fullscreen{font-size:10px}}
</style></head><body><iframe id="game" src="/play/index.html" title="เกมโรงพยาบาลวิกฤต สร้างด้วย Godot" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe><button id="fullscreen" aria-label="เล่นเต็มจอ">⛶ เต็มจอ</button><div id="rotate"><strong>หมุนจอ แล้วเข้าเวรกัน!</strong><p>ฉากโรงพยาบาลเล่นสะดวกในแนวนอน<br>แตะป้ายสถานีเพื่อเดินไปรับและส่งของ</p><button id="portrait">เล่นแนวตั้งต่อ</button></div><noscript>เกมนี้ต้องเปิด JavaScript และรองรับ WebGL 2 เพื่อเล่น Godot บนเว็บ</noscript><script>
document.getElementById('portrait').onclick=()=>document.getElementById('rotate').hidden=true;
document.getElementById('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{document.getElementById('fullscreen').textContent='ใช้โหมดแนวนอนเพื่อขยายเกม'}};
</script></body></html>
