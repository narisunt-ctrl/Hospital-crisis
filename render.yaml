services:
  - type: web
    name: hospital-crisis
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: python3 -m unittest discover -s tests -v
    startCommand: python3 server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
